<script type="6f1d0db8a16b90c0bf5deb00-text/javascript">
(function () {
    var btn = document.getElementById('passkey-login-btn');
    if (!btn || !window.PublicKeyCredential) return;
    var statusEl = document.getElementById('passkey-login-status');
    var form = btn.closest('form');
    function setStatus(msg, isErr) {
        if (!statusEl) return;
        statusEl.textContent = msg || '';
        statusEl.style.color = isErr ? '#d9534f' : '#6c7a89';
    }
    function b64urlToBytes(v) {
        var s = v.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        var raw = atob(s);
        var out = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
    }
    function bytesToB64url(buf) {
        var bytes = new Uint8Array(buf);
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }
    btn.addEventListener('click', async function () {
        try {
            btn.disabled = true;
            setStatus('Starting passkey sign-in...', false);
            var begin = await fetch('/passkeys?action=login_begin', { credentials: 'same-origin' });
            var beginJson = await begin.json();
            if (!beginJson.ok || !beginJson.publicKey) throw new Error(beginJson.error || 'passkey_begin_failed');
            var publicKey = beginJson.publicKey;
            publicKey.challenge = b64urlToBytes(publicKey.challenge);
            if (Array.isArray(publicKey.allowCredentials)) {
                publicKey.allowCredentials = publicKey.allowCredentials.map(function (c) {
                    c.id = b64urlToBytes(c.id);
                    return c;
                });
            }
            var cred = await navigator.credentials.get({ publicKey: publicKey, mediation: 'required' });
            if (!cred) throw new Error('passkey_cancelled');
            var payload = {
                id: cred.id,
                type: cred.type,
                rawId: bytesToB64url(cred.rawId),
                remember: !!(form && form.querySelector('#rememberme') && form.querySelector('#rememberme').checked),
                redirect: (form && form.querySelector('input[name=redirect]')) ? form.querySelector('input[name=redirect]').value : '',
                response: {
                    clientDataJSON: bytesToB64url(cred.response.clientDataJSON),
                    authenticatorData: bytesToB64url(cred.response.authenticatorData),
                    signature: bytesToB64url(cred.response.signature),
                    userHandle: cred.response.userHandle ? bytesToB64url(cred.response.userHandle) : ''
                }
            };
            var finish = await fetch('/passkeys?action=login_finish', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            var finishJson = await finish.json();
            if (!finishJson.ok || !finishJson.redirect) throw new Error((finishJson.error || 'passkey_login_failed') + (finishJson.detail ? (': ' + finishJson.detail) : ''));
            window.location.href = finishJson.redirect;
        } catch (e) {
            setStatus('Passkey sign-in failed: ' + (e && e.message ? e.message : 'unknown_error'), true);
            btn.disabled = false;
        }
    });
})();
</script>

    <script type="6f1d0db8a16b90c0bf5deb00-text/javascript">
    (function () {
        var alerts = document.querySelectorAll('.site-alert-banner');
        if (!alerts || !alerts.length) {
            return;
        }

        function keyHash(str) {
            var h = 0;
            for (var i = 0; i < str.length; i++) {
                h = ((h << 5) - h) + str.charCodeAt(i);
                h |= 0;
            }
            return 'nzb_site_alert_' + Math.abs(h);
        }

        function readState(storeKey) {
            try {
                var raw = window.localStorage.getItem(storeKey);
                if (!raw) {
                    return null;
                }
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function writeState(storeKey, state) {
            try {
                window.localStorage.setItem(storeKey, JSON.stringify(state));
            } catch (e) {
                /* no-op */
            }
        }

        function getUntil(mode) {
            var now = new Date();
            if (mode === 'today') {
                var end = new Date(now);
                end.setHours(23, 59, 59, 999);
                return end.getTime();
            }
            if (mode === 'week') {
                return now.getTime() + (7 * 24 * 60 * 60 * 1000);
            }
            return -1;
        }

        for (var i = 0; i < alerts.length; i++) {
            (function (alertEl) {
                var rawKey = alertEl.getAttribute('data-site-alert-key') || '';
                var storeKey = keyHash(rawKey);
                var state = readState(storeKey);
                var nowMs = (new Date()).getTime();

                if (state && (state.mode === 'dismiss' || (state.until && state.until > nowMs))) {
                    alertEl.style.display = 'none';
                    return;
                }

                var action = alertEl.querySelector('.site-alert-action');
                if (!action) {
                    return;
                }
                action.addEventListener('click', function (e) {
                    e.preventDefault();
                    var mode = action.getAttribute('data-site-alert-mode') || 'dismiss';
                    var until = getUntil(mode);
                    writeState(storeKey, { mode: mode, until: until });
                    alertEl.style.display = 'none';
                });
            })(alerts[i]);
        }
    })();
    </script>

        <script type="6f1d0db8a16b90c0bf5deb00-text/javascript">
    (function () {
        var content = document.getElementById('content');
        if (!content) {
            return;
        }

        function onTurnstileReady(callback, attempts) {
            var maxAttempts = (typeof attempts === 'number') ? attempts : 60;
            if (typeof turnstile !== 'undefined') {
                callback();
                return;
            }
            if (maxAttempts <= 0) {
                return;
            }
            window.setTimeout(function () {
                onTurnstileReady(callback, maxAttempts - 1);
            }, 100);
        }

        function initTurnstile(scope) {
            if (typeof turnstile === 'undefined') {
                return;
            }

            var root = scope || document;
            var forms = root.querySelectorAll('form.auth-turnstile-form');
            for (var i = 0; i < forms.length; i++) {
                (function (form) {
                    if (form.getAttribute('data-turnstile-initialized') === '1') {
                        return;
                    }

                    var siteKey = form.getAttribute('data-turnstile-sitekey');
                    var tokenInput = form.querySelector('input[name="cf-turnstile-response"]');
                    if (!siteKey || !tokenInput) {
                        return;
                    }

                    var widgetSize = form.getAttribute('data-turnstile-size') || 'normal';
                    var widgetTheme = form.getAttribute('data-turnstile-theme') || 'light';
                    var widgetTarget = form.querySelector('.turnstile-slot') || form;
                    var widgetId = turnstile.render(widgetTarget, {
                        sitekey: siteKey,
                        size: widgetSize,
                        theme: widgetTheme,
                        callback: function (token) {
                            tokenInput.value = token;
                        },
                        'expired-callback': function () {
                            tokenInput.value = '';
                            if (widgetSize === 'invisible') {
                                turnstile.execute(widgetId);
                            }
                        },
                        'error-callback': function () {
                            tokenInput.value = '';
                            if (widgetSize === 'invisible') {
                                setTimeout(function () {
                                    turnstile.execute(widgetId);
                                }, 1000);
                            }
                        }
                    });

                    form.setAttribute('data-turnstile-initialized', '1');
                    form.addEventListener('submit', function (event) {
                        if (!tokenInput.value) {
                            event.preventDefault();
                            turnstile.reset(widgetId);
                            if (widgetSize === 'invisible') {
                                turnstile.execute(widgetId);
                            }
                        }
                    });

                    if (widgetSize === 'invisible') {
                        turnstile.execute(widgetId);
                    }
                })(forms[i]);
            }
        }

        function updatePageMeta(doc) {
            var titleNode = doc.querySelector('title');
            if (titleNode && titleNode.textContent) {
                document.title = titleNode.textContent;
            }
        }

        function swapAuthPanel(url, pushState) {
            content.classList.add('auth-panel-fade-out');

            window.setTimeout(function () {
                $.ajax({
                    url: url,
                    method: 'GET',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    dataType: 'html'
                }).done(function (html) {
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(html, 'text/html');
                    var newContent = doc.getElementById('content');
                    if (!newContent) {
                        window.location.href = url;
                        return;
                    }

                    content.innerHTML = newContent.innerHTML;
                    updatePageMeta(doc);
                    content.classList.remove('auth-panel-fade-out');
                    content.classList.add('auth-panel-fade-in');

                    onTurnstileReady(function () {
                        initTurnstile(content);
                    });

                    var firstInput = content.querySelector('input:not([type="hidden"]):not([disabled])');
                    if (firstInput) {
                        firstInput.focus();
                    }

                    window.setTimeout(function () {
                        content.classList.remove('auth-panel-fade-in');
                    }, 260);

                    if (pushState === true) {
                        window.history.pushState({ authSwap: true }, '', url);
                    }
                }).fail(function () {
                    window.location.href = url;
                });
            }, 160);
        }

        function isAuthLink(href) {
            return /\/(login|register|forgottenpassword)(\?|$|\/)/.test(href);
        }

        content.addEventListener('click', function (event) {
            var el = event.target;
            while (el && el.tagName !== 'A') {
                el = el.parentNode;
            }
            if (!el) {
                return;
            }

            var href = el.getAttribute('href');
            if (!href || href.indexOf('javascript:') === 0 || el.target === '_blank') {
                return;
            }

            var absolute = el.href || href;
            if (!absolute || absolute.indexOf(window.location.origin) !== 0 || !isAuthLink(absolute)) {
                return;
            }

            event.preventDefault();
            swapAuthPanel(absolute, true);
        });

        window.addEventListener('popstate', function () {
            if (isAuthLink(window.location.pathname + window.location.search)) {
                swapAuthPanel(window.location.href, false);
            }
        });

        onTurnstileReady(function () {
            initTurnstile(document);
        });
    })();
    </script>
